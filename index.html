<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--! title page -->
    <title>What's For Dinner</title>
    <link rel="icon" href="./img/chrome_64.png">


    <!--! links page -->
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/media.css">
</head>

<body data-bs-spy="scroll" data-bs-target="#navbar-example">

    <!--* ========== Start Navbar Section ========== -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-3 my-nav">
        <div class="container">

            <div class="d-flex align-items-center">

                <div class="icon-page">
                    <i class="fa-solid fa-utensils"></i>
                </div>

                <div class="contant-page">
                    <h6 class="mb-0 fw-bold">What's For Dinner</h6>
                    <p class="mb-0">Your daily meal inspiration</p>
                </div>

            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fa-solid fa-bars" style="color: rgb(74, 85, 101);"></i>
            </button>


            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">


                <div class="icons-nav d-flex gap-4">

                    <div class="d-flex align-items-center gap-2">
                        <i class="fa-solid fa-bookmark" style="color: rgb(74, 85, 101);"></i>
                        <span class="d-none info ">Saved Recipes</span>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left" style="color: rgb(74, 85, 101);"></i>
                        <span class="d-none info">Recent</span>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <i class="fa-solid fa-gear" style="color: rgb(74, 85, 101);"></i>
                        <span class="d-none info">Settings</span>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <img src="./img/imgi_1_avatar-4.jpg" width="35" class="rounded-circle">
                        <span class="d-none info">Profile</span>
                    </div>
                </div>



            </div>

        </div>
    </nav>


    <!--* ========== End Navbar Section ========== -->


    <!-- ================================================================================ -->


    <!--* ========== Start hero Section ========== -->

    <section>
        <div class="my-menu py-5">
            <div class="container">
                <div class="row recipe-main-container g-0 ">
                    <div class="col-12 col-lg-5 recipe-visual-side position-relative p-0">
                        <div class="img-card position-relative">
                            <img id="recipe-img" src="/img/imgi_2_photo-1601050690597-df0568f70950.avif"
                                alt="Picture of the meal" class="img-fluid w-100 h-100 object-fit-cover">

                            <div
                                class="Rating-img position-absolute top-0 start-0 m-3 bg-white rounded-pill px-3 py-1 shadow d-flex align-items-center">
                                <i class="fa-solid fa-star me-1" style="color: rgb(255, 212, 59);"></i>
                                <p class="mb-0">

                                    <span id="recipe-rating"></span>

                                    <span class="text-muted" id="recipe-reviews"></span>

                                </p>
                            </div>

                            <div class="Stats-Card p-3">
                                <div class="row text-center g-0">
                                    <div class="col-4 ">
                                        <div class="d-flex flex-column align-items-center">
                                            <i class="fa-solid fa-clock mb-1"
                                                style="color: #ff6b00; font-size: 1.2rem;"></i>
                                            <small class="text-muted" style="font-size: 0.7rem;">Prep Time</small>
                                            <div class="fw-bold" id="prep-time"></div>
                                        </div>
                                    </div>
                                    <div class="col-4 ">
                                        <div class="d-flex flex-column align-items-center">
                                            <i class="fa-solid fa-fire-burner mb-1"
                                                style="color: #ff4d4d; font-size: 1.2rem;"></i>
                                            <small class="text-muted" style="font-size: 0.7rem;">Cook Time</small>
                                            <div class="fw-bold" id="cook-time"></div>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="d-flex flex-column align-items-center">
                                            <i class="fa-solid fa-users mb-1"
                                                style="color: #3b82f6; font-size: 1.2rem;"></i>
                                            <small class="text-muted" style="font-size: 0.7rem;">Servings</small>
                                            <div class="fw-bold" id="servings"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>


                    <div class="col-12 col-lg-7 p-4 bg-white .recipe-content-side ">

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="badges" id="recipe-badges">

                                <span id="difficulty-badge"
                                    class="badge rounded-pill bg-success-subtle text-success px-3 py-1">
                                </span>

                                <span id="category-badge"
                                    class="badge rounded-pill bg-primary-subtle text-primary px-3 py-1">
                                </span>

                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center ">
                            <div class="header">

                                <h1 id="recipe-title" class="fw-bold mb-2"></h1>
                                <p id="recipe-description" class="text-muted mb-4"></p>
                            </div>
                            <div class="actions">
                                <button class="btn btn-light rounded-3 me-2"><i
                                        class="fa-regular fa-bookmark"></i></button>
                                <button class="btn btn-light rounded-3"><i class="fa-solid fa-share-nodes"></i></button>
                            </div>
                        </div>


                        <nav>
                            <div class="nav nav-tabs mb-3" id="nav-tab" role="tablist">
                                <button class="nav-link active" id="nav-ingredients-tab" data-bs-toggle="tab"
                                    data-bs-target="#nav-ingredients" type="button" role="tab">
                                    <i class="fas fa-list-ul me-2"></i> Ingredients
                                </button>
                                <button class="nav-link" id="nav-instructions-tab" data-bs-toggle="tab"
                                    data-bs-target="#nav-instructions" type="button" role="tab">
                                    <i class="fas fa-book-open me-2"></i> Instructions
                                </button>
                                <button class="nav-link" id="nav-nutrition-tab" data-bs-toggle="tab"
                                    data-bs-target="#nav-nutrition" type="button" role="tab">
                                    <i class="fas fa-chart-pie me-2"></i> Nutrition
                                </button>
                                <button class="nav-link" id="nav-tips-tab" data-bs-toggle="tab"
                                    data-bs-target="#nav-tips" type="button" role="tab">
                                    <i class="fas fa-lightbulb me-2"></i> Chef's Tips
                                </button>
                            </div>
                        </nav>

                        <div class="tab-content" id="nav-tabContent">

                            <div class="tab-pane fade show active" id="nav-ingredients" role="tabpanel">

                                <div id="ing-list-container" class="list-group ingredients-container" ">
                                    
                                </div>
                            </div>

                           
                            <div class=" tab-pane instruction fade" id="nav-instructions" role="tabpanel">

                                    <div id="inst-list-container" class="instruction-step mb-1">

                                    </div>
                                </div>


                                <div class="tab-pane fade" id="nav-nutrition" role="tabpanel">
                                    <div class="row g-3">
                                        <div class="col-6">
                                            <div class="nutrition-card my-3">
                                                <div class="d-flex align-items-center">
                                                    <div class="nutrition-icon me-3"
                                                        style="background: #fff3ed; color: #ff5e14;"><i
                                                            class="fas fa-fire"></i></div>
                                                    <span>Calories</span>
                                                </div>

                                                <span class="fw-bold num" id="nut-cal"></span>
                                            </div>
                                            <div class="nutrition-card my-3">
                                                <div class="d-flex align-items-center">
                                                    <div class="nutrition-icon me-3"
                                                        style="background: #FEF9C2; color: #D08700;"><i
                                                            class="fa-solid fa-wheat-awn"></i></div>
                                                    <span>Carbohydrates</span>
                                                </div>
                                                <span class="fw-bold num" id="nut-carb"></span>
                                            </div>
                                            <div class="nutrition-card my-3">
                                                <div class="d-flex align-items-center">
                                                    <div class="nutrition-icon me-3"
                                                        style="background: #DBFCE7; color: #00A63E;"><i
                                                            class="fa-solid fa-seedling"></i></div>
                                                    <span>Fiber</span>
                                                </div>
                                                <span class="fw-bold num" id="nut-fiber"></span>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="nutrition-card my-3">
                                                <div class="d-flex align-items-center">
                                                    <div class="nutrition-icon me-3"
                                                        style="background: #FFE2E2; color: #E7000B;"><i
                                                            class="fa-solid fa-droplet"></i></div>
                                                    <span>Fat</span>
                                                </div>
                                                <span class="fw-bold num" id="nut-fat"></span>
                                            </div>
                                            <div class="nutrition-card my-3">
                                                <div class="d-flex align-items-center">
                                                    <div class="nutrition-icon me-3"
                                                        style="background: #FCE7F3; color: #E60076;"><i
                                                            class="fa-solid fa-cube"></i></div>
                                                    <span>Sodium</span>
                                                </div>
                                                <span class="fw-bold num" id="nut-sodium"></span>
                                            </div>
                                            <div class="nutrition-card my-3">
                                                <div class="d-flex align-items-center">
                                                    <div class="nutrition-icon me-3"
                                                        style="background: #eef4ff; color: #448aff;"><i
                                                            class="fa-solid fa-dumbbell"></i></div>
                                                    <span>Protein</span>
                                                </div>
                                                <span class="fw-bold num" id="nut-protein"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>


                                <div class="tab-pane tips fade" id="nav-tips" role="tabpanel">
                                    <div id="tips-list-container" class=" tips-step  d-flex flex-column gap-3 mt-3">
                                    </div>
                                </div>

                            </div>


                            <div class="mt-5 text-start">
                                <hr>
                                <button id="btn-refresh" class="btn btn-recipe-refresh shadow">
                                    <i class="fas fa-sync-alt me-2"></i> Try Another Recipe
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
    </section>

    <!--* ========== End hero Section ========== -->

    <!-- ================================================================================ -->


    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
